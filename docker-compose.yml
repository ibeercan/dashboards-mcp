services:
  dashboards-mcp:
    build: .
    container_name: dashboards-mcp
    ports:
      - "3456:3456"
    environment:
      # Streamable HTTP transport (stdio if unset)
      DASHBOARDS_MCP_HTTP_PORT: "3456"
      # HTTP API of the running BI backend (optional, for query_data / get_tables_info / HTTP fallback)
      DASHBOARDS_API_URL: "http://host.docker.internal:8014"
      # DASHBOARDS_API_TIMEOUT_MS: "60000"
    volumes:
      # Dashboard storage root (contains Dashboards/ and DefaultDashboards/)
      - ../Dashboards/App_Data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
